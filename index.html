<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Gem Arena</title><link rel="stylesheet" href="style.css?v=20260907-2"></head><body><div id="app">
<header><button id="heroBtn" class="heroMini" aria-label="Pilih hero">🐉</button><div><div class="brand">💎 GEM ARENA</div><small class="tag">Battle Match • Combo • Hero</small></div><div class="stats"><span>🪙 <b id="coins">1210</b></span><span>🏆 <b id="score">0</b></span></div></header>
<section class="profileStrip"><button id="profileBtn" class="profileCard"><span id="profileAvatar">🐉</span><span><b id="profileName">Gem Player</b><small id="profileRank">🥉 Bronze</small></span><em>›</em></button><div class="rankPoints"><small>RANK POINT</small><b id="rankPoints">0 RP</b><div><i id="rankFill"></i></div></div></section>
<section class="battleHud"><div class="fighter"><span id="playerAvatar">🐉</span><div><b>You</b><div class="hp"><i id="playerHp"></i></div><small id="playerHpText">100/100</small></div></div><div class="round"><b id="roundText">ROUND 1</b><small id="turnText">GILIRANMU</small></div><div class="fighter enemy"><div><b id="enemyName">Crystal Rogue</b><div class="hp enemyHp"><i id="enemyHp"></i></div><small id="enemyHpText">100/100</small></div><span id="enemyAvatar">🧙</span></div></section>
<section class="arena"><div><b id="heroName">🐉 Dragon Dancer</b><small id="heroDesc">Skill: Dragon Storm</small></div><button id="sound">🔊</button></section>
<section class="heroPower"><div class="energyTop"><span>⚡ ENERGY</span><b id="energyText">0/100</b></div><div class="energyBar"><i id="energyFill"></i></div><button id="skillBtn" disabled>🔒 KUMPULKAN ENERGY</button></section>
<div class="comboWrap"><div class="comboTop"><span>🔥 COMBO</span><b id="comboText">x1</b></div><div class="comboBar"><i id="comboFill"></i></div></div>
<section id="boosterBar"><button class="booster" data-booster="bomb">💣 <span>Bomb</span><b id="bombCount">0</b></button><button class="booster" data-booster="lightning">⚡ <span>Lightning</span><b id="lightningCount">0</b></button><button class="booster" data-booster="rainbow">🌈 <span>Rainbow</span><b id="rainbowCount">0</b></button></section>
<section class="campaignBar"><div class="campaignInfo"><span class="mapBadge" id="mapBadge">🗺️</span><div><small id="worldName">CRYSTAL GARDEN</small><b id="levelName">LEVEL 1</b></div></div><div class="xpBox"><small>XP</small><div class="xpBar"><i id="xpFill"></i></div><b id="xpText">0/100</b></div></section>
<div id="status">🎯 Giliranmu! Buat Match 3 untuk menyerang.</div><main id="board"></main>
<section class="missionBar"><div>📋 Daily Mission <b id="missionText">0/30 gem</b></div><button id="claimMission">🎁 150</button></section>
<footer><button id="mapBtn">🗺️ Map</button><button id="quickMatchBtn">⚡ Match</button><button id="leaderboardBtn">🏆 Rank</button><button id="profileFooter">👤 Profile</button><button id="chestBtn">🎁 Chest</button><button id="shuffle">🔀 Shuffle</button><button id="shop">🛒 Shop</button><button id="modeBtn">⚔️ Mode</button></footer></div>
<div id="fxLayer"></div><div id="modal" class="hidden"><div class="panel"><button id="close">✕</button><h2 id="modalTitle">Gem Arena</h2><div id="modalBody"></div></div></div><script src="game.js?v=20260907-2"></script></body></html>
