<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07170f"><meta name="description" content="Jungle Rush — game spin bertema hutan dengan Tiger Scatter.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<title>Jungle Rush</title><link rel="stylesheet" href="style.css?v=20260909-live1"></head>
<body><div id="app">
  <header class="topbar">
    <div class="playerCard"><div class="avatar">🐯</div><div><small>PLAYER</small><div class="coinLine">🪙 <b id="coins">250.000</b><button id="addCoins" aria-label="Tambah koin">＋</button></div></div></div>
    <div class="brandMini"><b>JUNGLE</b><span>RUSH</span></div>
    <div class="topActions"><button class="squareBtn" id="coinMenu">🪙<small>KOIN</small></button><button class="squareBtn" id="buySuper">🚀<small>SUPER</small></button><button class="squareBtn" id="sound">🎵<small>MUSIK</small></button><button class="squareBtn" id="settings">☰</button></div>
  </header>
  <main class="gameLayout">
    <aside class="leftPanel panelStack">
      <div class="modeCard slow">🎵<div><b>MODE BIASA</b><span>MUSIK SLOW</span></div></div>
      <div class="betCard"><small>TARUHAN</small><div><button id="minus">−</button><b id="bet">10.000</b><button id="plus">＋</button></div><small>MIN 1.000 · MAX 100.000</small></div>
      <div class="totalCard"><small>🏆 TOTAL WIN</small><b id="win">0</b></div>
      <button id="buyFree" class="sideBuy tigerBuy">🐯 <span>BELI FREE SPIN<small>50.000 COIN</small></span></button>
      <button id="buySuperSide" class="sideBuy superBuy">🚀 <span>SUPER SPIN<small>50.000 COIN</small></span></button>
      <button id="bonus" class="sideBuy bonusBuy">🪙 <span>TAMBAH KOIN</span></button>
    </aside>
    <section class="centerStage">
      <div class="jungleHero">
        <div class="leaf l1">🍃</div><div class="leaf l2">🦋</div><div class="leaf l3">🍃</div>
        <div class="logo"><strong>JUNGLE</strong><span>RUSH</span></div>
        <div class="tigerHead">🐯</div>
        <div class="jackpotBox"><small>👑 JACKPOT</small><b id="grand">125.000.000</b></div>
      </div>
      <div class="machineShell"><div id="freeSpinBar" class="freeSpinBar"></div><div id="reels" class="reels" aria-label="Mesin permainan"></div></div>
      <div class="bottomControls">
        <button id="how" class="control infoBtn">ⓘ <span>INFO</span></button>
        <button id="speed" class="control turboBtn">⚡ <span>TURBO</span></button>
        <button id="superBtn" class="control superBtn">2×<span>SUPER</span></button>
        <button id="spin" class="spin">SPIN<small>HOLD FOR AUTO</small></button>
        <button id="auto" class="control autoBtn">AUTO<span>OFF</span></button>
        <button class="control dailyBtn" id="bonusBottom">🎁<span>BONUS HARIAN</span></button>
      </div>
    </section>
    <aside class="rightPanel panelStack">
      <div class="modeCard fast">🎵<div><b>MODE SCATTER</b><span>MUSIK ENERJIK</span></div></div>
      <div class="scatterPanel"><h3>3+ SCATTER</h3><div class="diamond">💎</div><h4>MODE SCATTER</h4><p>TRIGGER</p><b>5 FREE SPIN</b><div class="tinyTigers">🐯 🐯 🐯</div></div>
    </aside>
  </main>
</div>
<div id="modal" class="hidden"><div class="modalCard"><button id="close">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="demo-ads.js?v=20260909d"></script><script src="game.js?v=20260909-live1"></script><script src="purchase.js?v=20260909d"></script><script src="super-spin.js?v=20260909f"></script>
<script>document.getElementById('buySuperSide').onclick=()=>document.getElementById('buySuper').click();document.getElementById('bonusBottom').onclick=()=>document.getElementById('bonus').click();document.getElementById('coinMenu').onclick=()=>document.getElementById('addCoins').click();document.getElementById('superBtn').onclick=()=>document.getElementById('speed').click();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=20260909-live1').catch(()=>{}))}</script>
</body></html>
