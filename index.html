<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tiger Reel Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <button id="settings">⚙</button>
      <div class="title">🐯 <span>TIGER</span> REEL</div>
      <div>CREDITS<br><b id="credits">5,000</b></div>
    </header>

    <aside id="panel">
      <b>SETTINGS</b>
      <label>🔊 Sound <input id="sound" type="checkbox" checked></label>
      <label>🔉 Volume <input id="volume" type="range" value="70"></label>
      <button id="free">🎰 FREE SPIN BONUS</button>
      <button id="ad">📺 WATCH DEMO AD <span id="ads">0</span>/5</button>
    </aside>

    <section class="machine">
      <h1>✦ TIGER REEL ✦</h1>
      <div id="reels" class="reels"></div>
      <div class="win">WIN <strong id="win">0</strong></div>
    </section>

    <p id="message">READY • TEKAN SPIN</p>

    <section class="controls">
      <button id="minus">−</button>
      <div>BET<br><b id="bet">50</b></div>
      <button id="plus">+</button>
      <button id="spin">SPIN</button>
    </section>

    <section class="speed">
      <button data-speed="slow" class="active">SLOW</button>
      <button data-speed="normal">NORMAL</button>
      <button data-speed="fast">FAST</button>
      <button data-speed="2x">2X</button>
    </section>

    <footer>Free-to-play demo • Virtual credits only • No real-money wagering</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
